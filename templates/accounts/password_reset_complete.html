{% extends "accounts/base_auth.html" %}
{% block title %}Password Updated — Cargo Management{% endblock %}

{% block content %}
<div style="text-align:center;">
  <div style="width:56px;height:56px;border-radius:50%;background:rgba(46,158,107,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="var(--success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  </div>
  <h2>Password updated</h2>
  <p class="sub">Your password has been reset successfully. You can now sign in with your new password.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="text-decoration:none;display:inline-flex;margin-top:8px;">Sign in</a>
</div>
{% endblock %}
